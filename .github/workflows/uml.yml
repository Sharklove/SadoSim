name: Generate UML Diagram

on:
  push:
    branches:
      - test

jobs:
  generate-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x' # プロジェクトの.NETバージョンに合わせてください

      - name: Install tools
        run: |
          # PlantUmlClassDiagramGeneratorをインストール
          dotnet tool install --global PlantUmlClassDiagramGenerator
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate PlantUML puml file
        run: |
          mkdir -p Docs/uml
          # C#コードのpumlファイルを生成
          # Assets/Scriptというディレクトリがなければ、Assets/Scriptsに変更してください
          puml-gen Assets/Script Docs/uml -dir -ignore bin,obj,Properties -createAssociation -allInOne

      - name: Generate UML image
        run: |
          # PlantUMLとJava、Graphvizをインストール
          sudo apt-get update
          sudo apt-get install -y default-jre graphviz
          # PlantUMLのjarファイルをダウンロード
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          # pumlファイルからSVG画像を生成
          java -jar plantuml.jar -tsvg Docs/uml

      - name: Add and commit UML diagram
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Auto-generate UML diagram'
          add_options: '--force'
          file_pattern: 'Docs/uml/*.svg'