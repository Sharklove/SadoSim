name: Generate UML Diagram

on:
  push:
    branches:
      - ebi1

jobs:
  generate-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Download PlantUML
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Install puml-gen from GitHub
        run: |
          mkdir -p tools
          curl -L -o tools/puml-gen https://github.com/gsf/PlantUmlClassDiagramGenerator/releases/latest/download/puml-gen
          chmod +x tools/puml-gen

      - name: Build UML Generator Tool
        run: |
          mkdir -p build
          dotnet new console -n UmlTool -o build --force
          cp Editor/PlantUmlGitTools.cs build/Program.cs
          dotnet build build/UmlTool.csproj -c Release

      - name: Run UML Generator Tool
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/tools"
          dotnet run --project build/UmlTool.csproj -c Release

      - name: Upload UML Diagrams
        uses: actions/upload-artifact@v4
        with:
          name: UML-Diagrams
          path: Docs/uml/*.svg