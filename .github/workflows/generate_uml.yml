name: Generate UML Diagram

on:
  push:
    branches:
      - ebi1

jobs:
  generate-uml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Download PlantUML
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Install puml-gen tool
        run: dotnet tool install --global puml-gen

      - name: Add global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build UML Generator Tool
        run: |
          mkdir -p build
          dotnet new console -n UmlTool -o build --force
          cp Editor/PlantUmlGitTools.cs build/Program.cs
          dotnet build build/UmlTool.csproj -c Release

      - name: Run UML Generator Tool
        run: dotnet run --project build/UmlTool.csproj -c Release

      - name: Upload UML Diagrams
        uses: actions/upload-artifact@v3
        with:
          name: UML-Diagrams
          path: Docs/uml/*.svg