name: Generate UML Diagram

on:
  push:
    branches:
      - ebi1

jobs:
  generate-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x' # プロジェクトの.NETバージョンに合わせて変更

      - name: Install PlantUmlClassDiagramGenerator
        run: dotnet tool install -g PlantUmlClassDiagramGenerator

      - name: Generate PlantUML diagram
        run: |
          mkdir -p uml
          dotnet tool run plantumlclassdiagramgenerator -o uml/unity_classes.puml ./**/*.cs

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate UML image
        run: |
          curl -LJO https://github.com/plantuml/plantuml/releases/download/v1.2023.10/plantuml.jar
          java -jar plantuml.jar uml/unity_classes.puml -o uml

      - name: Upload PlantUML file as artifact
        uses: actions/upload-artifact@v4 # v3をv4に更新
        with:
          name: plantuml-diagram
          path: uml/unity_classes.puml

      - name: Add and commit UML diagram
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Auto-generate UML diagram'
          add_options: '--force'
          file_pattern: 'uml/*.png'