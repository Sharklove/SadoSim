name: Generate UML Diagram

on:
  push:
    branches:
      - ebi1
  workflow_dispatch:

jobs:
  generate-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x' # プロジェクトの.NETバージョンに合わせて変更

      - name: Install PlantUmlClassDiagramGenerator
        run: dotnet tool install -g PlantUmlClassDiagramGenerator

      - name: Generate PlantUML diagram
        run: |
          mkdir -p uml
          dotnet-pucd -o uml/unity_classes.puml ./**/*.cs

      - name: Upload PlantUML file as artifact
        uses: actions/upload-artifact@v3
        with:
          name: plantuml-diagram
          path: uml/unity_classes.puml

      - name: Generate UML image
        uses: plantuml/plantuml-action@v2
        with:
          path: uml/unity_classes.puml
          format: png

      - name: Add and commit UML diagram
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Auto-generate UML diagram'
          add_options: '--force'
          file_pattern: 'uml/*.png'